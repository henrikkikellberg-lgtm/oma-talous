<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B6B3A">
<title>oma·talous · matkat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Sama design-järjestelmä kuin index.html (CLAUDE.md → Design-järjestelmä). */
:root{
  --bg:#F2F6FA;--surface:#FFFFFF;--surface2:#EAF0F6;--border:#D8E4EE;
  --green:#1B6B3A;--green-mid:#2D8A52;--green-light:#E5F2EB;
  --gold:#B5883E;--gold-light:#FAF3E6;--blue:#1A5BAB;--blue-light:#E8F0FA;
  --text:#0E1C2D;--muted:#5A6E82;--dim:#9AAAB8;--red:#C0322A;--red-light:#FBECEB;
  --radius:10px;--radius-sm:7px;--radius-lg:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh}
a{color:var(--blue);text-decoration:none}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:.5px solid var(--border)}
.hwrap{max-width:980px;margin:0 auto;padding:0 16px;height:52px;display:flex;align-items:center;gap:12px}
.logo{font-size:14px;font-weight:500;white-space:nowrap}.logo .dot{color:var(--gold)}
.logo small{font-weight:400;color:var(--muted);margin-left:6px}
.back{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:16px 16px calc(60px + env(safe-area-inset-bottom,0px))}
.lbl{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi .v{font-size:22px;font-weight:300;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.t-green{border-top:2.5px solid var(--green)}.t-gold{border-top:2.5px solid var(--gold)}.t-blue{border-top:2.5px solid var(--blue)}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--muted)}
h1{font-size:22px;font-weight:500}
h2{font-size:18px;font-weight:500;margin:24px 0 10px;display:flex;align-items:baseline;gap:10px}
h2 .lbl{margin-left:auto}
.sub{font-size:13px;color:var(--muted);margin:4px 0 16px}
.bar{height:3px;background:var(--surface2);border-radius:2px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:3px;border-radius:2px;background:var(--gold);transition:width .4s ease}
.grp{background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.ghead .ic{font-size:18px;width:24px;text-align:center}
.ghead .n{flex:1;min-width:0}.ghead .n b{font-weight:500;font-size:15px}
.ghead .n .m{font-size:12px;color:var(--muted);margin-top:1px}
.ghead .v{font-size:17px;font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}
.ghead .chev{color:var(--dim);font-size:12px;transition:transform .15s ease}
.grp.open .chev{transform:rotate(90deg)}
.gbody{display:none;border-top:.5px solid var(--surface2);padding:4px 14px 8px}
.grp.open .gbody{display:block}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:.5px solid var(--surface2);align-items:center}
.row:last-child{border-bottom:none}
.row .p{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted);grid-column:1}
.row .a{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;grid-row:1/3;grid-column:2;text-align:right}
.row .ed{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:9px;background:var(--blue-light);color:var(--blue);margin-left:4px;vertical-align:1px}
.tag.cash{background:var(--gold-light);color:var(--gold)}
.tag.flag{background:var(--red-light);color:var(--red)}
.twrap{background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:right;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:.5px solid var(--border);white-space:nowrap}
td{text-align:right;padding:8px 10px;border-bottom:.5px solid var(--surface2);white-space:nowrap;vertical-align:top}
th:first-child,td:first-child{text-align:left;white-space:normal}
td .m{font-size:11px;color:var(--muted);margin-top:2px;white-space:normal}
tr.tot td{font-weight:500;border-bottom:none}
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.trip{cursor:pointer;transition:all .15s ease}.trip:active{transform:scale(.98)}
.trip .nm{font-size:16px;font-weight:500}.trip .dt{font-size:12px;color:var(--muted);margin:2px 0 10px}
.trip .v{font-size:22px;font-weight:300;font-variant-numeric:tabular-nums}
.btn{height:40px;padding:0 16px;border-radius:var(--radius);border:.5px solid var(--border);background:var(--surface);color:var(--text);font:500 14px 'Inter',sans-serif;cursor:pointer;transition:all .15s ease}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.on{background:var(--green-light);border-color:var(--green);color:var(--green)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
input,select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font:14px 'Inter',sans-serif;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--green)}
.ed select,.ed input{font-size:12px;padding:5px 8px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.panel{margin-top:12px}
.cand{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:.5px solid var(--surface2);cursor:pointer}
.cand:last-child{border-bottom:none}
.cand .i{flex:1;min-width:0}.cand .p{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .m{font-size:11px;color:var(--muted)}
.cand .a{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cand .plus{width:26px;height:26px;border-radius:13px;border:1px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.note{font-size:12px;color:var(--muted);margin:8px 0;line-height:1.5}
.warn{font-size:12px;padding:8px 12px;border-radius:var(--radius-sm);background:var(--gold-light);color:var(--gold);margin:8px 0}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.x{border:none;background:none;color:var(--dim);font-size:16px;cursor:pointer;padding:0 4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--radius);font-size:13px;opacity:0;transition:opacity .25s ease;pointer-events:none;z-index:50}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">oma<span class="dot">·</span>talous<small>matkat · v1.21.0</small></div>
    <a class="back" id="back" href="index.html">← Oma talous</a>
  </div>
</header>
<main id="main"><div class="empty">Ladataan…</div></main>
<div id="toast"></div>

<script>
// ── Matkat (v1.21.0) ─────────────────────────────────────────────────────────
// Matka kokoaa reissun kulut kaikilta tileiltä, myös ennen matkaa maksetut.
// Kohdistus on oma kenttä (transactions.trip_id), ei kategoria → budjetit ja
// NWS-jakauma eivät muutu. Ryhmä (lennot, majoitus, auto…) arvataan ja sen voi
// vaihtaa riveittäin. share_group yhdistää yhteisen oston ja sen takaisinmaksut.
// Käteinen on trip_items-taulussa: näkyy vain täällä, ei saldoissa.
// Ks. api/migrations/009_trips.sql ja CLAUDE.md → Matkat.
const API_BASE = 'https://oma-talous-api.henrikki-kellberg.workers.dev';
const SECRET = (()=>{ try { return localStorage.getItem('ot_secret')||''; } catch(e){ return ''; } })();
const HDR = {'Content-Type':'application/json','Authorization':`Bearer ${SECRET}`};

const GROUPS = [
  ['lennot','Lennot','✈️'], ['majoitus','Majoitus','🏨'], ['auto','Auto','🚗'],
  ['liikkuminen','Taksit ja julkiset','🚕'], ['ruoka','Ruoka ja juoma','🍽️'],
  ['tekeminen','Tekeminen','🎟️'], ['ostokset','Ostokset','🛍️'], ['muut','Muut','📦'],
];
const GNAME = Object.fromEntries(GROUPS.map(g=>[g[0],g[1]]));
// Kategoriat joita ei koskaan ehdoteta matkalle: siirtoja, säästöä, korkoja.
const NEVER = /^(Säästölipas|Sijoittaminen|Luotot — korko|Luotot — lyhennys|Palkka ja tulot|MobilePay & siirrot)$/;

let TX = [], TRIPS = [], ITEMS = [], trip = null;
let edit = false, openG = new Set(), candQ = '', candAll = false;

const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = (n, d=2) => (n<-0.004?'−':'') + Math.abs(n).toLocaleString('fi-FI',{minimumFractionDigits:d,maximumFractionDigits:d}) + ' €';
const eur0 = n => eur(n,0);
const fdate = d => { const [y,m,dd]=d.split('-'); return `${+dd}.${+m}.${y}`; };
const sdate = d => { const [,m,dd]=d.split('-'); return `${+dd}.${+m}.`; };
const days = t => Math.round((new Date(t.end_date)-new Date(t.start_date))/864e5)+1;
const r2 = n => Math.round(n*100)/100;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.opacity=1; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.opacity=0,2200); }
async function api(path, method='GET', body){
  const r = await fetch(API_BASE+path, {method, headers:HDR, ...(body!==undefined?{body:JSON.stringify(body)}:{})});
  if (r.status===401) throw new Error('Kirjautuminen vanhentunut — kirjaudu uudelleen oma·talous-sovelluksessa.');
  if (!r.ok) throw new Error(`Virhe ${r.status}`);
  return r.json();
}

// ── Ryhmittely ───────────────────────────────────────────────────────────────
// Järjestys ratkaisee: auto ennen ruokaa, koska tiemaksu (ATTIKI ODOS) on
// tiliotteella kahvilana; ruoka ennen majoitusta, koska hotellin baari on baari.
function autoGroup(t){
  const p = (t.payee||'').toLowerCase(), c = t.cat||'';
  if (/hertz|avis|sixt|europcar|enterprise|rent ?a ?car|autovuokra|\bavin\b|shell|\beko\b|revoil|jet oil|polttoaine|fuel|parking|pysäköin|attiki odos|olympia odos|nea odos|\btolls?\b/.test(p)) return 'auto';
  if (/^(Ravintolat|Kahvilat|Baarit|Lounas|Päivittäistavarat)$/.test(c)) return 'ruoka';
  if (/bolt|uber|taxi|taksi|oasa|metro|\bktel\b|ferry|lautta|\bhsl\b/.test(p) || c.startsWith('Liikkuminen')) return 'liikkuminen';
  if (/aegean|airline|airways|finnair|ryanair|norwegian|lufthansa|wizz|easyjet|airbaltic|\bsas\b|lento/.test(p)) return 'lennot';
  if (/hotel|booking|airbnb|hostel|apartment|resort|majoitus|\bhtl\b/.test(p)) return 'majoitus';
  if (c==='Ostokset') return 'ostokset';
  if (/^(Harrastukset|Kulttuuri ja viihde)$/.test(c)) return 'tekeminen';
  return 'muut';
}
function tripRows(){
  if (!trip) return [];
  const tx = TX.filter(t=>t.trip_id===trip.id).map(t=>({...t, src:'tx', amount:+t.amount}));
  const it = ITEMS.filter(i=>i.trip_id===trip.id).map(i=>({...i, src:'item', payee:i.label, account:'Käteinen', cat:'Käteinen', amount:+i.amount}));
  const rows = [...tx, ...it];
  // Takaisinmaksu ilman omaa ryhmää perii yhteiskulun suurimman oston ryhmän
  // (Teijan 240 € käteisenä → Hertz → auto), jotta netto osuu oikeaan ryhmään.
  const main = {};
  for (const r of rows) if (r.share_group && r.amount<0) {
    const g = r.trip_group || autoGroup(r);
    if (!main[r.share_group] || r.amount < main[r.share_group].a) main[r.share_group] = {a:r.amount, g};
  }
  for (const r of rows) {
    r.auto = autoGroup(r);
    r.g = r.trip_group || (r.amount>0 && r.share_group && main[r.share_group]?.g) || r.auto;
  }
  return rows.sort((a,b)=>a.date.localeCompare(b.date) || a.amount-b.amount);
}
function totals(rows){
  const paid = -rows.filter(r=>r.amount<0).reduce((s,r)=>s+r.amount,0);
  const back = rows.filter(r=>r.amount>0).reduce((s,r)=>s+r.amount,0);
  return {paid:r2(paid), back:r2(back), own:r2(paid-back)};
}

// ── Matkalista ───────────────────────────────────────────────────────────────
function renderList(){
  const back = document.getElementById('back');
  back.href = 'index.html'; back.textContent = '← Oma talous'; back.onclick = null;
  const cards = TRIPS.map(t=>{
    const rows = TX.filter(x=>x.trip_id===t.id).map(x=>+x.amount).concat(ITEMS.filter(i=>i.trip_id===t.id).map(i=>+i.amount));
    const own = -rows.reduce((s,a)=>s+a,0);
    return `<div class="card trip t-gold" onclick="go('${esc(t.id)}')">
      <div class="nm">${esc(t.name)}</div>
      <div class="dt">${fdate(t.start_date)} – ${fdate(t.end_date)} · ${days(t)} pv · ${rows.length} riviä</div>
      <div class="lbl">Oma kulu</div><div class="v">${eur0(own)}</div>
      <div class="note" style="margin:2px 0 0">${eur0(own/days(t))} / päivä</div></div>`;
  }).join('');
  document.getElementById('main').innerHTML = `
    <h1>Matkat</h1>
    <div class="sub">Reissun kaikki kulut yhdessä paikassa, myös ennen matkaa maksetut lennot ja majoitukset. Takaisinmaksut netotetaan omaksi osuudeksi.</div>
    ${TRIPS.length ? `<div class="trips">${cards}</div>` : '<div class="empty">Ei vielä matkoja.</div>'}
    <h2>Uusi matka</h2>
    <div class="card"><div class="form">
      <label>Nimi<input id="nName" placeholder="esim. Kreikka 2026"></label>
      <label>Alkaa<input id="nStart" type="date"></label>
      <label>Päättyy<input id="nEnd" type="date"></label>
      <button class="btn pri" onclick="createTrip()">Luo matka</button>
    </div></div>`;
}
async function createTrip(){
  const name=document.getElementById('nName').value.trim(), s=document.getElementById('nStart').value, e=document.getElementById('nEnd').value;
  if (!name||!s||!e) return toast('Täytä nimi ja päivät');
  if (e<s) return toast('Loppupäivä on ennen alkua');
  try {
    const {id} = await api('/trips','POST',{name,start_date:s,end_date:e});
    TRIPS.unshift({id,name,start_date:s,end_date:e});
    edit = true; go(id);
  } catch(err){ toast(err.message); }
}
function go(id){
  const u = new URL(location.href);
  if (id) u.searchParams.set('id', id); else u.searchParams.delete('id');
  history.pushState(null,'',u); route();
}
window.addEventListener('popstate', route);

// ── Matkasivu ────────────────────────────────────────────────────────────────
function render(){
  const back = document.getElementById('back');
  back.href = 'matka.html'; back.textContent = '← Matkat';
  back.onclick = e => { e.preventDefault(); go(null); };
  const rows = tripRows(), T = totals(rows), d = days(trip);
  const shop = totals(rows.filter(r=>r.g==='ostokset')).own;
  const flags = rows.filter(r=>r.src==='tx' && r.type==='flag').length;
  const byG = GROUPS.map(([k,n,ic])=>({k,n,ic,rows:rows.filter(r=>r.g===k)})).filter(g=>g.rows.length).map(g=>({...g,...totals(g.rows)}));
  const maxOwn = Math.max(1, ...byG.map(g=>g.own));

  let h = `<h1>${esc(trip.name)}</h1>
    <div class="sub">${fdate(trip.start_date)} – ${fdate(trip.end_date)} · ${d} päivää${trip.note?' · '+esc(trip.note):''}</div>
    <div class="grid">
      <div class="card kpi t-gold"><div class="lbl">Oma kulu</div><div class="v">${eur0(T.own)}</div><div class="s">${shop?`ilman ostoksia ${eur0(T.own-shop)}`:'&nbsp;'}</div></div>
      <div class="card kpi"><div class="lbl">Per päivä</div><div class="v">${eur0(T.own/d)}</div><div class="s">${shop?`ilman ostoksia ${eur0((T.own-shop)/d)}`:'&nbsp;'}</div></div>
      <div class="card kpi"><div class="lbl">Maksoin</div><div class="v">${eur0(T.paid)}</div><div class="s">kaikki ostot bruttona</div></div>
      <div class="card kpi t-blue"><div class="lbl">Sain takaisin</div><div class="v">${eur0(T.back)}</div><div class="s">seurueelta</div></div>
    </div>
    ${flags?`<div class="warn">${flags} riviä on budjetissa vielä kategorisoimatta. Matkan summat ovat silti oikein.</div>`:''}
    <div class="acts">
      <button class="btn sm ${edit?'on':''}" onclick="edit=!edit;render()">${edit?'✓ Valmis':'✎ Muokkaa'}</button>
      ${edit?`<button class="btn sm" onclick="openAll()">Avaa kaikki</button>`:''}
    </div>
    <h2>Kulut ryhmittäin</h2>`;

  h += byG.map(g=>`<div class="grp ${openG.has(g.k)||edit?'open':''}" id="g-${g.k}">
    <div class="ghead" onclick="toggleG('${g.k}')">
      <div class="ic">${g.ic}</div>
      <div class="n"><b>${esc(g.n)}</b><div class="m">${g.rows.length} riviä${g.back?` · maksoin ${eur0(g.paid)}, takaisin ${eur0(g.back)}`:''}</div>
        <div class="bar"><i style="width:${Math.max(0,g.own)/maxOwn*100}%"></i></div></div>
      <div class="v">${eur(g.own)}</div><div class="chev">▶</div>
    </div>
    <div class="gbody">${g.rows.map(rowHTML).join('')}</div></div>`).join('') || '<div class="empty">Matkalle ei ole vielä kohdistettu rivejä.</div>';

  // Yhteiskulut
  const shares = {};
  for (const r of rows) if (r.share_group) (shares[r.share_group] ||= []).push(r);
  const sk = Object.keys(shares).sort((a,b)=>totals(shares[b]).paid-totals(shares[a]).paid);
  if (sk.length) {
    let tp=0,tb=0;
    h += `<h2>Yhteiskulut</h2><div class="twrap"><table><thead><tr><th>Kulu</th><th>Maksoin</th><th>Takaisin</th><th>Oma osuus</th></tr></thead><tbody>` +
      sk.map(k=>{ const s=totals(shares[k]); tp+=s.paid; tb+=s.back;
        const who = shares[k].filter(r=>r.amount>0).map(r=>`${esc(shortName(r))} ${eur0(r.amount)}`).join(', ');
        return `<tr><td>${esc(k)}${who?`<div class="m">${who}</div>`:''}</td><td>${eur(s.paid)}</td><td class="pos">${s.back?eur(s.back):'–'}</td><td><b style="font-weight:500">${eur(s.own)}</b></td></tr>`; }).join('') +
      `<tr class="tot"><td>Yhteensä</td><td>${eur(tp)}</td><td class="pos">${eur(tb)}</td><td>${eur(tp-tb)}</td></tr></tbody></table></div>`;
  }

  if (edit) h += editPanels();
  document.getElementById('main').innerHTML = h;
}
function shortName(r){
  const m = (r.viesti||'').match(/Alkuperäinen maksaja:\s*(\S+)/);
  if (m) return m[1];
  const n = (r.payee||'').match(/\(([^,)]+)/); if (n) return n[1];
  return r.payee||'';
}
function rowHTML(r){
  const acc = r.src==='item' ? '<span class="tag cash">käteinen</span>' : esc(r.account);
  const tags = (r.share_group?`<span class="tag">${esc(r.share_group)}</span>`:'') + (r.type==='flag'?'<span class="tag flag">kategorisoimatta</span>':'');
  const name = r.amount>0 && /mobilepay/i.test(r.payee||'') ? `MobilePay ← ${shortName(r)}` : (r.payee||r.selitys);
  let ed = '';
  if (edit) {
    const key = `${r.src}:${r.id}`;
    ed = `<div class="ed">
      <select onchange="setRow('${esc(key)}','trip_group',this.value||null)">
        <option value="">auto (${esc(GNAME[r.auto])})</option>
        ${GROUPS.map(([k,n])=>`<option value="${k}" ${r.trip_group===k?'selected':''}>${esc(n)}</option>`).join('')}
      </select>
      <input list="shareList" placeholder="yhteiskulu…" value="${esc(r.share_group||'')}" style="width:140px" onchange="setRow('${esc(key)}','share_group',this.value.trim()||null)">
      <button class="x" title="Poista matkalta" onclick="removeRow('${esc(key)}')">×</button></div>`;
  }
  return `<div class="row"><div class="p">${esc(name)}</div>
    <div class="a ${r.amount>0?'pos':''}">${r.amount>0?'+':''}${eur(r.amount)}</div>
    <div class="m">${sdate(r.date)} · ${acc}${r.src==='tx'?' · '+esc(r.cat||'–'):''}${tags}</div>${ed}</div>`;
}
function toggleG(k){ if (edit) return; openG.has(k)?openG.delete(k):openG.add(k); document.getElementById('g-'+k)?.classList.toggle('open'); }
function openAll(){ GROUPS.forEach(g=>openG.add(g[0])); render(); }

// ── Muokkaus ─────────────────────────────────────────────────────────────────
function editPanels(){
  const shares = [...new Set(tripRows().map(r=>r.share_group).filter(Boolean))];
  const cands = candidates();
  return `<datalist id="shareList">${shares.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
    <h2>Lisää rivejä <span class="lbl" id="candN">${cands.length} ehdotusta</span></h2>
    <div class="note">Oletuksena näkyvät matkan ajalta (ja 3 päivää paluun jälkeen) tilien rivit, joita ei ole vielä kohdistettu mihinkään matkaan. Haulla löydät myös etukäteen maksetut lennot ja majoitukset.</div>
    <div class="acts" style="margin-top:0">
      <input type="search" placeholder="Hae maksunsaajalla tai summalla…" value="${esc(candQ)}" oninput="candQ=this.value;clearTimeout(window._ct);window._ct=setTimeout(renderCands,200)" style="flex:1;min-width:180px">
      <button class="btn sm ${candAll?'on':''}" onclick="candAll=!candAll;render()">${candAll?'Vain matkan ajalta':'Kaikki päivät'}</button>
    </div>
    <div class="twrap panel" id="cands">${candsHTML(cands)}</div>
    <h2>Käteinen</h2>
    <div class="note">Käteisrivit näkyvät vain matkalla, eivät tilien saldoissa eivätkä budjetissa. Takaisin saatu käteinen kirjataan plussalla ja yhdistetään yhteiskuluun.</div>
    <div class="card"><div class="form">
      <label>Päivä<input id="cDate" type="date" value="${trip.end_date}" min="${trip.start_date}"></label>
      <label>Selite<input id="cLabel" placeholder="esim. hotelliyö Ateena"></label>
      <label>Summa €<input id="cAmt" type="number" step="0.01" inputmode="decimal" placeholder="90"></label>
      <label>Suunta<select id="cDir"><option value="-1">Maksoin</option><option value="1">Sain takaisin</option></select></label>
      <label>Ryhmä<select id="cGroup"><option value="">auto</option>${GROUPS.map(([k,n])=>`<option value="${k}">${esc(n)}</option>`).join('')}</select></label>
      <label>Yhteiskulu<input id="cShare" list="shareList" placeholder="valinnainen"></label>
      <button class="btn pri" onclick="addItem()">Lisää</button>
    </div></div>
    <h2>Matkan tiedot</h2>
    <div class="card"><div class="form">
      <label>Nimi<input id="eName" value="${esc(trip.name)}"></label>
      <label>Alkaa<input id="eStart" type="date" value="${trip.start_date}"></label>
      <label>Päättyy<input id="eEnd" type="date" value="${trip.end_date}"></label>
      <button class="btn" onclick="saveTrip()">Tallenna</button>
      <button class="btn" style="color:var(--red)" onclick="deleteTrip()">Poista matka</button>
    </div></div>`;
}
function candsHTML(cands){
  return cands.slice(0,80).map(t=>`<div class="cand" onclick="addTx('${esc(t.id)}')">
      <div class="plus">+</div><div class="i"><div class="p">${esc(t.payee||t.selitys)}</div>
      <div class="m">${fdate(t.date)} · ${esc(t.account)} · ${esc(t.cat||'–')}</div></div>
      <div class="a ${+t.amount>0?'pos':''}">${eur(+t.amount)}</div></div>`).join('') || '<div class="empty">Ei ehdotuksia.</div>';
}
// Hakukenttä päivittää vain listan, jotta kenttä ei menetä fokusta kesken kirjoituksen.
function renderCands(){
  const c = candidates(), box = document.getElementById('cands'); if (!box) return;
  box.innerHTML = candsHTML(c); document.getElementById('candN').textContent = `${c.length} ehdotusta`;
}
// Korttiostot kirjautuvat pankkiin 1–3 päivän viiveellä ja paluupäivän ostot
// (lentokenttä, viimeinen ravintola) jäivät muuten ehdotuksista pois
// (Madeira 3/2026: Funchal TB 4.3., Madeira Duty Free 5.3.).
const TAIL_DAYS = 3;
function addDays(iso, n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function candidates(){
  const q = candQ.trim().toLowerCase();
  const endW = addDays(trip.end_date, TAIL_DAYS);
  const qn = parseFloat(q.replace(',','.').replace(/[^\d.]/g,''));
  return TX.filter(t=>!t.trip_id && t.type!=='neutral' && t.type!=='savings' && !NEVER.test(t.cat||'')
      && (candAll || q || (t.date>=trip.start_date && t.date<=endW))
      && (!q || ((t.payee||'')+' '+(t.selitys||'')+' '+(t.viesti||'')+' '+(t.cat||'')).toLowerCase().includes(q)
             || (!isNaN(qn) && Math.abs(Math.abs(+t.amount)-qn)<0.005)))
    .sort((a,b)=>b.date.localeCompare(a.date));
}
async function addTx(id){
  const t = TX.find(x=>x.id===id); if (!t) return;
  t.trip_id = trip.id; render();
  try { await api(`/transactions/${encodeURIComponent(id)}`,'PUT',{trip_id:trip.id}); }
  catch(e){ t.trip_id = null; render(); toast('Tallennus epäonnistui'); }
}
async function setRow(key, field, val){
  const [src, ...rest] = key.split(':'); const id = rest.join(':');
  const obj = src==='tx' ? TX.find(x=>x.id===id) : ITEMS.find(x=>x.id===id); if (!obj) return;
  const prev = obj[field]; obj[field] = val; render();
  try { await api(src==='tx'?`/transactions/${encodeURIComponent(id)}`:`/trip_items/${encodeURIComponent(id)}`,'PUT',{[field]:val}); }
  catch(e){ obj[field] = prev; render(); toast('Tallennus epäonnistui'); }
}
async function removeRow(key){
  const [src, ...rest] = key.split(':'); const id = rest.join(':');
  try {
    if (src==='tx') {
      await api(`/transactions/${encodeURIComponent(id)}`,'PUT',{trip_id:null,trip_group:null,share_group:null});
      const t = TX.find(x=>x.id===id); if (t) Object.assign(t,{trip_id:null,trip_group:null,share_group:null});
    } else {
      if (!confirm('Poistetaanko käteisrivi?')) return;
      await api(`/trip_items/${encodeURIComponent(id)}`,'DELETE');
      ITEMS = ITEMS.filter(x=>x.id!==id);
    }
    render();
  } catch(e){ toast('Poisto epäonnistui'); }
}
async function addItem(){
  const date=document.getElementById('cDate').value, label=document.getElementById('cLabel').value.trim();
  const amt=parseFloat(String(document.getElementById('cAmt').value).replace(',','.'));
  if (!date||!label||!(amt>0)) return toast('Täytä päivä, selite ja summa');
  const it = {trip_id:trip.id, date, label, amount:r2(amt*+document.getElementById('cDir').value),
    trip_group:document.getElementById('cGroup').value||null, share_group:document.getElementById('cShare').value.trim()||null};
  try { const {id} = await api('/trip_items','POST',it); ITEMS.push({...it,id}); render(); toast('Lisätty'); }
  catch(e){ toast('Tallennus epäonnistui'); }
}
async function saveTrip(){
  const u = {name:document.getElementById('eName').value.trim(), start_date:document.getElementById('eStart').value, end_date:document.getElementById('eEnd').value};
  if (!u.name||!u.start_date||!u.end_date||u.end_date<u.start_date) return toast('Tarkista nimi ja päivät');
  try { await api(`/trips/${encodeURIComponent(trip.id)}`,'PUT',u); Object.assign(trip,u); render(); toast('Tallennettu'); }
  catch(e){ toast('Tallennus epäonnistui'); }
}
async function deleteTrip(){
  if (!confirm(`Poistetaanko matka "${trip.name}"? Tapahtumat säilyvät, vain kohdistus ja käteisrivit poistuvat.`)) return;
  try {
    await api(`/trips/${encodeURIComponent(trip.id)}`,'DELETE');
    TX.forEach(t=>{ if (t.trip_id===trip.id) Object.assign(t,{trip_id:null,trip_group:null,share_group:null}); });
    ITEMS = ITEMS.filter(i=>i.trip_id!==trip.id); TRIPS = TRIPS.filter(t=>t.id!==trip.id);
    edit=false; go(null);
  } catch(e){ toast('Poisto epäonnistui'); }
}

// ── Käynnistys ───────────────────────────────────────────────────────────────
function route(){
  const id = new URL(location.href).searchParams.get('id');
  trip = id ? TRIPS.find(t=>t.id===id) || null : null;
  if (!trip) { edit=false; renderList(); } else render();
  window.scrollTo(0,0);
}
async function init(){
  if (!SECRET) { document.getElementById('main').innerHTML = `<div class="empty">Kirjaudu ensin <a href="index.html">oma·talous-sovellukseen</a>.</div>`; return; }
  try {
    [TX, TRIPS, ITEMS] = await Promise.all([api('/transactions'), api('/trips'), api('/trip_items')]);
    TX = TX.filter(t=>t.account!=='Vuokra');
    route();
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="empty">${esc(e.message||'Lataus epäonnistui')}</div>`;
  }
}
init();
</script>
</body>
</html>
